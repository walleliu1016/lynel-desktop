<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<title>定时任务页面重设计 · 草图 v2</title>
<style>
/* ===== 取自 src/renderer/src/styles/theme.css（浅色） ===== */
:root, [data-theme="light"] {
  --bg-primary:#F5F5F7; --bg-panel:#FFFFFF; --bg-input:#FFFFFF; --bg-card:#ffffff;
  --accent:#0071E3; --accent-deep:#0060DF;
  --accent-soft-bg:rgba(0,113,227,0.10); --accent-soft-border:rgba(0,113,227,0.30);
  --text-primary:#1D1D1F; --text-secondary:#6E6E73; --text-tertiary:#86868B; --text-inverse:#FFFFFF;
  --status-success:#34C759; --status-success-soft:rgba(52,199,89,0.12);
  --status-warn:#FF9F0A; --status-warn-soft:rgba(255,159,10,0.12);
  --status-error:#FF3B30; --status-error-soft:rgba(255,59,48,0.12);
  --status-warn-bg:rgba(245,158,11,0.12); --status-warn-border:rgba(245,158,11,0.35);
  --border:rgba(0,0,0,0.08); --border-strong:rgba(0,0,0,0.12); --border-focus:var(--accent);
  --bg-hover:#F0F0F2; --bg-selected:var(--accent-soft-bg);
  --radius-sm:8px; --radius-md:10px; --radius-lg:14px; --radius-pill:999px;
  --fs-caption:12px; --fs-body-sm:13px; --fs-body:14px; --fs-title:18px;
  --shadow-window:0 24px 48px -12px rgba(0,0,0,0.22), 0 4px 12px rgba(0,0,0,0.06);
  --shadow-panel:0 0 0 1px var(--border), 0 2px 6px rgba(0,0,0,0.05);
  --shadow-card:0 1px 3px rgba(13,24,41,0.04);
  --scrim:rgba(0,0,0,0.40);
}
[data-theme="dark"] {
  --bg-primary:#1C1C1E; --bg-panel:#2C2C2E; --bg-input:#2C2C2E; --bg-card:#2C2C2E;
  --accent:#0A84FF; --accent-deep:#0071E3;
  --accent-soft-bg:rgba(10,132,255,0.16); --accent-soft-border:rgba(10,132,255,0.30);
  --text-primary:#F5F5F7; --text-secondary:#98989D; --text-tertiary:#6E6E73; --text-inverse:#FFFFFF;
  --status-success:#30D158; --status-success-soft:rgba(48,209,88,0.16);
  --status-warn:#FFD60A; --status-warn-soft:rgba(255,214,10,0.16);
  --status-error:#FF453A; --status-error-soft:rgba(255,69,58,0.16);
  --status-warn-bg:rgba(255,214,10,0.16); --status-warn-border:rgba(255,214,10,0.45);
  --border:rgba(255,255,255,0.12); --border-strong:rgba(255,255,255,0.20); --border-focus:var(--accent);
  --bg-hover:#3A3A3C; --bg-selected:var(--accent-soft-bg);
  --shadow-window:0 24px 48px -12px rgba(0,0,0,0.5), 0 4px 12px rgba(0,0,0,0.3);
  --shadow-panel:0 0 0 1px var(--border), 0 2px 6px rgba(0,0,0,0.35);
  --shadow-card:0 1px 3px rgba(0,0,0,0.3);
  --scrim:rgba(0,0,0,0.55);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: var(--fs-body); color: var(--text-primary); background: var(--bg-primary);
  display: flex; flex-direction: column; overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
.num { font-variant-numeric: tabular-nums; }

/* ===== 草图外壳（正式设计里没有） ===== */
.sketchbar { display:flex; align-items:center; gap:10px; padding:8px 14px; background:var(--bg-panel); border-bottom:1px solid var(--border); flex:none; }
.sketchbar .tag { font-size:11px; color:var(--text-tertiary); border:1px dashed var(--border-strong); border-radius:var(--radius-pill); padding:3px 10px; }
.sketchbar .sp { flex:1; }
.sketchbar label { font-size:var(--fs-caption); color:var(--text-secondary); display:inline-flex; gap:5px; align-items:center; cursor:pointer; }
.screen { flex:1; min-height:0; display:flex; padding:14px; }
.frame { flex:1; min-width:0; display:flex; overflow:hidden; background:var(--bg-primary); border:1px solid var(--border-strong); border-radius:var(--radius-lg); box-shadow:var(--shadow-card); }

/* ===== 通用组件层（§6.1 抽公共类） ===== */
.btn { display:inline-flex; align-items:center; gap:5px; padding:5px 10px; border-radius:var(--radius-sm); font-size:var(--fs-caption); font-family:inherit; border:1px solid var(--border); background:var(--bg-card); color:var(--text-secondary); cursor:pointer; white-space:nowrap; }
.btn:hover { background:var(--bg-hover); }
.btn.primary { background:var(--accent); color:var(--text-inverse); border-color:transparent; box-shadow:0 1px 2px var(--accent-soft-bg); }
.btn.primary:hover { background:var(--accent-deep); }
.btn.ghost { border-color:transparent; background:transparent; padding:5px 7px; }
.btn.ghost:hover { background:var(--bg-hover); color:var(--text-primary); }
.btn.icon { padding:5px; }
.btn.tall { padding:7px 16px; }
:focus-visible { outline:2px solid var(--border-focus); outline-offset:2px; }

.pill { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:var(--radius-pill); font-size:11px; font-weight:500; white-space:nowrap; }
.pill.done { background:var(--status-success-soft); color:var(--status-success); }
.pill.error, .pill.timeout { background:var(--status-error-soft); color:var(--status-error); }
.pill.running { background:var(--accent-soft-bg); color:var(--accent); }
.pill.queued, .pill.skipped, .pill.interrupted { background:var(--bg-hover); color:var(--text-secondary); }
.chip { font-size:11px; padding:2px 8px; border-radius:var(--radius-pill); background:var(--bg-hover); color:var(--text-secondary); }
.chip b { font-weight:600; color:var(--text-primary); }

.micro { font-size:10px; letter-spacing:.7px; text-transform:uppercase; color:var(--text-tertiary); font-weight:600; }

/* ===== 左栏：任务列表 ===== */
.tlist { width:272px; flex:none; display:flex; flex-direction:column; background:var(--bg-panel); border-right:1px solid var(--border); min-height:0; }
.tlist-hd { padding:10px; border-bottom:1px solid var(--border); }
.tlist-hd .btn.primary { width:100%; justify-content:center; padding:7px; }
.filters { padding:8px 10px; display:flex; gap:6px; align-items:center; border-bottom:1px solid var(--border); }
.search { flex:1; min-width:0; display:flex; align-items:center; gap:6px; padding:0 8px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--bg-input); }
.search input { flex:1; min-width:0; border:none; outline:none; background:transparent; font-family:inherit; font-size:var(--fs-caption); color:var(--text-primary); padding:5px 0; }
.search input::placeholder { color:var(--text-tertiary); }
.trows { flex:1; min-height:0; overflow-y:auto; padding:4px 0; }
.trow { display:grid; grid-template-columns:auto 1fr auto; gap:3px 9px; align-items:center; padding:8px 10px 8px 12px; cursor:pointer; border-left:2px solid transparent; }
.trow:hover { background:var(--bg-hover); }
.trow.sel { background:var(--bg-selected); border-left-color:var(--accent); }
.trow .nm { font-size:var(--fs-body-sm); font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.trow .meta { grid-column:2; font-size:var(--fs-caption); color:var(--text-tertiary); display:flex; align-items:center; gap:6px; overflow:hidden; }
.trow.off .nm { color:var(--text-tertiary); font-weight:400; }
.trow.off .meta { opacity:.62; }
.sd { width:7px; height:7px; border-radius:50%; flex:none; }
.sd.on { background:var(--status-success); }
.sd.off { background:var(--text-tertiary); opacity:.45; }
.sd.err { background:var(--status-error); }
.sd.run { background:var(--accent); box-shadow:0 0 0 3px var(--accent-soft-bg); }
.toggle { width:22px; height:22px; border:none; background:transparent; border-radius:var(--radius-sm); padding:0; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; color:var(--text-tertiary); opacity:0; }
.trow:hover .toggle, .trow.sel .toggle { opacity:1; }
.toggle:hover { background:var(--bg-hover); color:var(--text-primary); }
.group-label { padding:12px 12px 5px; font-size:10px; letter-spacing:.7px; color:var(--text-tertiary); text-transform:uppercase; font-weight:600; }

/* ===== 右栏：详情 ===== */
.detail { flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden; background:var(--bg-primary); }
.tbar { flex:none; display:flex; align-items:center; gap:11px; height:52px; padding:0 18px; background:var(--bg-panel); border-bottom:1px solid var(--border); }
.tbar h3 { margin:0; font-size:var(--fs-title); font-weight:600; letter-spacing:-.2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tbar .grow { flex:1; min-width:0; }
.seg { display:inline-flex; gap:2px; padding:2px; border:1px solid var(--border); border-radius:var(--radius-pill); background:var(--bg-input); }
.seg > button { display:inline-flex; align-items:center; gap:5px; height:24px; padding:0 11px; border:none; border-radius:var(--radius-pill); background:transparent; font-size:11px; font-family:inherit; color:var(--text-secondary); cursor:pointer; }
.seg > button:hover { color:var(--text-primary); }
.seg > button.on { background:var(--bg-panel); color:var(--text-primary); font-weight:500; box-shadow:var(--shadow-card); }
.seg .badge { font-size:10px; padding:0 5px; min-width:16px; text-align:center; border-radius:var(--radius-pill); background:var(--bg-hover); color:var(--text-tertiary); }
.seg > button.on .badge { background:var(--accent-soft-bg); color:var(--accent); }

.sumbar { flex:none; display:flex; align-items:center; gap:7px; padding:9px 18px; border-bottom:1px solid var(--border); background:var(--bg-primary); }
.dbody { flex:1; min-height:0; overflow-y:auto; }

.runhead { display:flex; align-items:center; gap:10px; padding:12px 18px; background:var(--bg-panel); border-bottom:1px solid var(--border); }
.runhead .big { font-weight:600; font-size:var(--fs-body); }
.runhead .link { margin-left:auto; color:var(--accent); cursor:pointer; font-size:var(--fs-caption); }
.runhead .link:hover { text-decoration:underline; }
.runhead .mets { display:flex; gap:6px; margin-left:auto; }

.stream { padding:16px 20px 26px; }
.meta-line { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:var(--fs-caption); color:var(--text-tertiary); margin-bottom:12px; }
.md-text { font-size:var(--fs-body-sm); margin:10px 0 14px; line-height:1.65; }
.md-text p { margin:6px 0; }
.md-text table { border-collapse:collapse; margin:8px 0; font-size:var(--fs-caption); }
.md-text th, .md-text td { border:1px solid var(--border); padding:4px 9px; text-align:left; }
.md-text th { background:var(--bg-hover); font-weight:600; }
.md-text code { font-family:ui-monospace,Consolas,monospace; font-size:11px; padding:1px 4px; border-radius:3px; background:var(--bg-hover); }
.fold { display:inline-flex; align-items:center; gap:6px; cursor:pointer; font-size:var(--fs-caption); color:var(--text-secondary); padding:4px 0; }
.fold:hover { color:var(--text-primary); }
.tool { border:1px solid var(--border); border-radius:var(--radius-md); background:var(--bg-card); margin:9px 0; overflow:hidden; box-shadow:var(--shadow-card); }
.tool .th { display:flex; align-items:center; gap:8px; padding:8px 11px; font-size:var(--fs-caption); cursor:pointer; }
.tool .tname { font-weight:600; color:var(--text-primary); }
.tool .tsum { color:var(--text-secondary); font-family:ui-monospace,Consolas,monospace; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0; }
.tool .tdelta { font-size:11px; font-family:ui-monospace,Consolas,monospace; color:var(--status-success); }
.tool .tout { border-top:1px solid var(--border); background:var(--bg-input); padding:9px 11px; }
.tool .tout pre { margin:0; font-family:ui-monospace,Consolas,monospace; font-size:11px; line-height:1.65; white-space:pre-wrap; color:var(--text-primary); }
.res { border:1px solid var(--status-success); border-radius:var(--radius-md); background:var(--status-success-soft); padding:13px 15px; margin-top:20px; }
.res.err { border-color:var(--status-error); background:var(--status-error-soft); }
.res .rh { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.res .rh .big { font-weight:600; font-size:var(--fs-body); }
.res .note { margin-top:7px; font-size:11px; color:var(--text-tertiary); }

/* 运行历史：时间轴（比纯列表更有"运行序列"的语义） */
.tl { position:relative; padding:8px 18px 8px 44px; }
.tl::before { content:''; position:absolute; left:26px; top:22px; bottom:22px; width:1px; background:var(--border-strong); }
.tlrow { position:relative; display:flex; align-items:center; gap:11px; padding:9px 12px; border-radius:var(--radius-md); cursor:pointer; font-size:var(--fs-caption); }
.tlrow:hover { background:var(--bg-hover); }
.tlrow.sel { background:var(--bg-selected); }
.tlrow .node { position:absolute; left:-24px; top:50%; margin-top:-6px; width:11px; height:11px; border-radius:50%; background:var(--bg-primary); border:2px solid var(--text-tertiary); }
.tlrow .node.ok { border-color:var(--status-success); background:var(--status-success); box-shadow:0 0 0 3px var(--status-success-soft); }
.tlrow .node.bad { border-color:var(--status-error); background:var(--status-error); box-shadow:0 0 0 3px var(--status-error-soft); }
.tlrow .when { width:96px; flex:none; color:var(--text-primary); font-weight:500; }
.tlrow .tg { width:38px; flex:none; color:var(--text-tertiary); }
.tlrow .ms { flex:1; min-width:0; color:var(--text-secondary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tlrow .mt { flex:none; color:var(--text-tertiary); font-family:ui-monospace,Consolas,monospace; }
.more { padding:12px 18px 18px; text-align:center; }

.blank { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:9px; height:100%; min-height:340px; text-align:center; padding:24px; }
.blank .ic { width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--bg-hover); color:var(--text-tertiary); margin-bottom:4px; }
.blank h4 { margin:0; font-size:var(--fs-body); font-weight:600; }
.blank p { margin:0; font-size:var(--fs-caption); color:var(--text-tertiary); max-width:320px; line-height:1.65; }
.blank .btn { margin-top:8px; }

/* ===== 弹窗 ===== */
.overlay { position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; padding:26px; background:var(--scrim); }
.dlg { display:flex; flex-direction:column; max-width:100%; max-height:100%; background:var(--bg-panel); border-radius:var(--radius-lg); box-shadow:var(--shadow-window); overflow:hidden; }
.dlg.wide { width:812px; height:620px; }
.dlg.narrow { width:560px; }
.dlg-hd { display:flex; align-items:center; padding:15px 20px; border-bottom:1px solid var(--border); font-weight:600; font-size:var(--fs-body); flex:none; }
.dlg-hd .sub { font-weight:400; font-size:var(--fs-caption); color:var(--text-tertiary); margin-left:9px; }
.dlg-hd .x { margin-left:auto; color:var(--text-tertiary); cursor:pointer; display:flex; }
.dlg-hd .x:hover { color:var(--text-primary); }
.dlg-ft { display:flex; align-items:center; gap:8px; padding:14px 20px; border-top:1px solid var(--border); background:var(--bg-primary); flex:none; }
.dlg-ft .sp { flex:1; }

/* 两栏：左模板栏 + 右表单 */
.dlg-cols { flex:1; min-height:0; display:flex; }
.rail { width:236px; flex:none; display:flex; flex-direction:column; border-right:1px solid var(--border); background:var(--bg-primary); min-height:0; }
.rail-hd { padding:10px; border-bottom:1px solid var(--border); }
.rail-list { flex:1; min-height:0; overflow-y:auto; padding:6px; }
.rail-item { display:flex; align-items:center; gap:9px; width:100%; padding:7px 9px; border:none; background:transparent; border-radius:var(--radius-sm); font-family:inherit; font-size:var(--fs-caption); color:var(--text-secondary); cursor:pointer; text-align:left; }
.rail-item:hover { background:var(--bg-hover); }
.rail-item.on { background:var(--accent-soft-bg); color:var(--accent); font-weight:500; }
.rail-item svg { flex:none; }
.rail-item .rn { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.rail-item .rmark { font-size:9px; letter-spacing:.5px; text-transform:uppercase; color:var(--text-tertiary); border:1px solid var(--border); border-radius:var(--radius-pill); padding:0 5px; flex:none; }
.rail-item.on .rmark { color:var(--accent); border-color:var(--accent-soft-border); }
.rail-ft { padding:8px 10px 10px; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:6px; }
.rail-ft .btn { justify-content:center; width:100%; }
.rail-empty { padding:20px 12px; text-align:center; font-size:var(--fs-caption); color:var(--text-tertiary); }

.form { flex:1; min-width:0; display:flex; flex-direction:column; min-height:0; }
.form-bd { flex:1; min-height:0; overflow-y:auto; padding:18px 20px 22px; display:flex; flex-direction:column; gap:20px; }

.sec { display:flex; flex-direction:column; gap:10px; }
.sec-hd { display:flex; align-items:baseline; gap:9px; }
.sec-hd .t { font-size:var(--fs-body-sm); font-weight:600; }
.sec-hd .d { font-size:11px; color:var(--text-tertiary); }
.sec-hd .anno { margin-left:auto; }

/* 模板头卡：右栏顶部，说明当前选中的模板 */
.tmpl-card { display:flex; align-items:center; gap:12px; padding:12px 14px; border:1px solid var(--border); border-radius:var(--radius-md); background:var(--bg-card); box-shadow:var(--shadow-card); }
.tmpl-card .ti { width:34px; height:34px; border-radius:var(--radius-sm); background:var(--accent-soft-bg); color:var(--accent); display:flex; align-items:center; justify-content:center; flex:none; }
.tmpl-card .tt { font-size:var(--fs-body-sm); font-weight:600; }
.tmpl-card .td { font-size:var(--fs-caption); color:var(--text-tertiary); margin-top:2px; }

.radios { display:flex; flex-wrap:wrap; gap:6px; }
.radio { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:6px 13px; border:1px solid var(--border); border-radius:var(--radius-pill); font-size:var(--fs-caption); color:var(--text-secondary); cursor:pointer; background:var(--bg-card); user-select:none; font-family:inherit; }
.radio:hover { background:var(--bg-hover); }
.radio.on { border-color:var(--accent); background:var(--accent-soft-bg); color:var(--accent); font-weight:500; }
/* 周几选择器：34×34 圆角方片，选中实心 accent */
.week { display:inline-flex; gap:6px; }
.wd {
  width:34px; height:34px; border-radius:var(--radius-sm);
  border:1px solid var(--border); background:var(--bg-card); color:var(--text-secondary);
  font-family:inherit; font-size:var(--fs-body-sm); cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center;
}
.wd:hover { background:var(--bg-hover); color:var(--text-primary); border-color:var(--border-strong); }
.wd.on { background:var(--accent); border-color:var(--accent); color:var(--text-inverse); font-weight:600; box-shadow:0 1px 3px var(--accent-soft-bg); }
.wd.on:hover { background:var(--accent-deep); }
.presets { display:inline-flex; gap:2px; }
.preset {
  border:none; background:transparent; font-family:inherit; font-size:11px;
  color:var(--accent); cursor:pointer; padding:5px 8px; border-radius:var(--radius-sm);
}
.preset:hover { background:var(--accent-soft-bg); }
.row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
input.inp, textarea.inp, select.inp { font-family:inherit; font-size:var(--fs-caption); padding:7px 10px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--bg-input); color:var(--text-primary); outline:none; }
input.inp:focus, textarea.inp:focus, select.inp:focus { border-color:var(--border-focus); box-shadow:0 0 0 3px var(--accent-soft-bg); }
textarea.inp { width:100%; resize:vertical; min-height:96px; line-height:1.65; }
select.inp { padding:7px 8px; }
.mono { font-family:ui-monospace,Consolas,monospace; }
.dim { color:var(--text-tertiary); }
.small { font-size:var(--fs-caption); }
.field { display:flex; gap:10px; align-items:flex-start; }
.field > label { width:44px; flex:none; font-size:var(--fs-caption); color:var(--text-secondary); padding-top:8px; }
.field > .ctl { flex:1; min-width:0; }

.preview { display:flex; align-items:center; gap:10px; padding:8px 11px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--bg-input); font-size:var(--fs-caption); color:var(--text-secondary); flex-wrap:wrap; }
.preview .lb { font-size:10px; letter-spacing:.6px; text-transform:uppercase; color:var(--text-tertiary); font-weight:600; }
.preview .pl { font-family:ui-monospace,Consolas,monospace; color:var(--text-primary); }

.adv { border-top:1px solid var(--border); padding-top:12px; }
.warn { display:flex; gap:9px; padding:11px 13px; background:var(--status-warn-bg); border:1px solid var(--status-warn-border); border-radius:var(--radius-sm); font-size:var(--fs-caption); line-height:1.55; }
.warn svg { color:var(--status-warn); flex:none; margin-top:1px; }

.sp { flex:1; }
.menu { position:absolute; z-index:60; min-width:172px; padding:5px; background:var(--bg-panel); border:1px solid var(--border-strong); border-radius:var(--radius-md); box-shadow:var(--shadow-panel); }
.menu button { display:flex; align-items:center; gap:8px; width:100%; padding:7px 9px; border:none; background:transparent; border-radius:var(--radius-sm); font-family:inherit; font-size:var(--fs-caption); color:var(--text-secondary); cursor:pointer; text-align:left; }
.menu button:hover { background:var(--bg-hover); color:var(--text-primary); }
.menu button.danger:hover { background:var(--status-error-soft); color:var(--status-error); }
.menu .sep { height:1px; background:var(--border); margin:5px 3px; }

.anno { display:none; font-size:10px; font-weight:600; color:var(--accent); background:var(--accent-soft-bg); border:1px solid var(--accent-soft-border); border-radius:var(--radius-pill); padding:1px 7px; margin-left:6px; white-space:nowrap; }
body.annotate .anno { display:inline-block; }
.hidden { display:none !important; }
</style>
</head>
<body>

<div class="sketchbar">
  <span class="tag">草图 v2 · 非最终实现</span>
  <span class="small dim">模板改成左栏（可搜索 / 分组 / 我的模板），表单在右栏</span>
  <span class="sp"></span>
  <label><input type="checkbox" id="annoToggle" /> 显示新增标注</label>
  <label><input type="checkbox" id="tlToggle" checked /> 历史用时间轴</label>

</div>

<div class="screen">
  <div class="frame">
    <div class="tlist">
      <div class="tlist-hd">
        <button class="btn primary" onclick="openForm('create')">

          新建任务

      </div>
      <div class="filters">
        <div class="search">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input placeholder="搜索任务…" />
        </div>
        <button class="btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18"/><path d="M7 12h10"/><path d="M10 18h4"/></svg>
          筛选
        </button>
      </div>
      <div class="trows" id="taskRows"></div>
    </div>

    <div class="detail">
      <div class="tbar">
        <span class="sd" id="tbarDot"></span>
        <div class="grow"><h3 id="tbarName">每日 CI 失败巡检</h3></div>
        <div class="seg" id="viewSeg">
          <button data-view="run" class="on">运行<span class="anno">默认</span></button>
          <button data-view="history">历史<span class="badge" id="runCount">6</span><span class="anno">收进按钮</span></button>
        </div>
        <button class="btn primary" id="runNowBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></svg>
          立即执行
        </button>
        <button class="btn ghost icon" id="moreBtn" title="更多">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
        </button>

      <div class="sumbar" id="sumbar"></div>
      <div class="dbody" id="paneRun"></div>

        <div class="more"><button class="btn">加载更早的运行记录</button></div>
      </div>
    </div>
  </div>
</div>

<script>
/* ============ 图标（内联 lucide，键名与 Icon.vue 已注册的一致） ============ */
const I = {
  play:'<path d="M6 3l20 12-20 9z" fill="currentColor" stroke="none"/>',
  activity:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
  'file-text':'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v5h5"/><path d="M8 13h8"/><path d="M8 17h8"/>',
  'shield-alert':'<path d="M20 13c0 5-3.5 7.5-7.7 8.9a1 1 0 0 1-.6 0C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.2-2.7a1 1 0 0 1 1.5 0C14.5 3.8 17 5 19 5a1 1 0 0 1 1 1z"/><path d="M12 8v4"/><path d="M12 16h.01"/>',
  trash:'<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',

  plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  warning:'<path d="m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  slash:'<path d="M22 2 2 22"/>',

  copy:'<rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
  terminal:'<path d="m4 17 6-6-6-6"/><path d="M12 19h8"/>',
  layers:'<path d="m12.83 2.18 8.36 4.18a1 1 0 0 1 0 1.79l-8.36 4.18a2 2 0 0 1-1.66 0L2.81 8.15a1 1 0 0 1 0-1.79l8.36-4.18a2 2 0 0 1 1.66 0z"/><path d="m22 12.5-9.17 4.58a2 2 0 0 1-1.66 0L2 12.5"/>',
  'chevron-right':'<path d="m9 18 6-6-6-6"/>',
  'chevron-down':'<path d="m6 9 6 6 6-6"/>',
  close:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  bookmark:'<path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>',
  rocket:'<path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>',
};
const svg = (n, s = 14, sw = 2) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${I[n] || ''}</svg>`;

const STATUS = {
  done:{label:'成功',icon:'check',cls:'done'}, error:{label:'失败',icon:'warning',cls:'error'},
  timeout:{label:'超时',icon:'clock',cls:'timeout'}, interrupted:{label:'中断',icon:'slash',cls:'interrupted'},
  skipped:{label:'已跳过',icon:'slash',cls:'skipped'}, running:{label:'运行中',icon:'activity',cls:'running'},
  queued:{label:'排队中',icon:'clock',cls:'queued'},
};
const pill = (s) => { const m = STATUS[s] || STATUS.queued; return `<span class="pill ${m.cls}">${svg(m.icon,11)}${m.label}</span>`; };

/* ============ 假数据 ============ */
const tasks = [
  { id:'t1', name:'每日 CI 失败巡检', enabled:true,  schedule:'每天 09:00',   next:'明天 09:00', last:'done',        lastAt:'2 小时前', cost:'0.031', runs:6 },
  { id:'t2', name:'依赖安全审计',     enabled:true,  schedule:'每周一 09:00', next:'周一 09:00', last:null,          lastAt:null,       cost:null,    runs:0 },
  { id:'t3', name:'清理构建产物',     enabled:true,  schedule:'每周五 18:00', next:'周五 18:00', last:'error',       lastAt:'3 天前',   cost:'0.088', runs:4 },
  { id:'t4', name:'周报汇总',         enabled:false, schedule:'每周一 10:00', next:null,         last:'interrupted', lastAt:'上周',     cost:'0.014', runs:2 },
];
const runsByTask = {
  t1:[
    { id:'r6', status:'done',        trigger:'自动', when:'09-21 09:00', ms:'修复了 3 个失败的 job',     meta:'8轮 · 1m20s · $0.031' },
    { id:'r5', status:'error',       trigger:'自动', when:'09-20 09:00', ms:'超出最大轮次限制',         meta:'12轮 · 3m02s · $0.088' },
    { id:'r4', status:'done',        trigger:'手动', when:'09-19 14:12', ms:'没有失败的 job',           meta:'3轮 · 0m22s · $0.011' },
    { id:'r3', status:'interrupted', trigger:'手动', when:'09-18 16:40', ms:'用户取消',                 meta:'4轮 · 0m41s · $0.014' },
    { id:'r2', status:'done',        trigger:'自动', when:'09-18 09:00', ms:'修复了 1 个失败的 job',    meta:'6轮 · 0m58s · $0.024' },
    { id:'r1', status:'timeout',     trigger:'自动', when:'09-17 09:00', ms:'超过 30 分钟上限，已终止', meta:'— · 30m00s · $0.210' },
  ],
  t3:[
    { id:'r3a', status:'error', trigger:'自动', when:'09-18 18:00', ms:'无法启动 claude：PATH 里没有找到', meta:'0轮 · 0m01s' },
    { id:'r3b', status:'done',  trigger:'自动', when:'09-11 18:00', ms:'清理了 1.2 GB 构建产物',           meta:'4轮 · 0m33s · $0.017' },
  ],
  t4:[
    { id:'r4a', status:'interrupted', trigger:'手动', when:'09-14 10:05', ms:'用户取消', meta:'2轮 · 0m18s · $0.014' },
  ],
};

const STREAM_OK = `
  <div class="meta-line"><span>Claude Code 2.1.114</span><span class="dim">·</span><span>claude-sonnet-4-6</span><span class="dim">·</span><span class="mono">…\\.lynel-desktop\\tasks</span><span class="dim">·</span><span>12 个工具</span></div>
  <div class="fold">${svg('chevron-right',12)} 思考</div>
  <div class="md-text"><p>先看一下最近的 CI 记录，定位失败的 job。</p></div>
  <div class="tool"><div class="th">${svg('terminal',13)}<span class="tname">Bash</span><span class="tsum">gh run list --limit 10 --json name,conclusion</span></div></div>
  <div class="tool"><div class="th">${svg('pencil',13)}<span class="tname">Edit</span><span class="tsum">src/parser.ts</span><span class="tdelta">+18 −6</span></div>
    <div class="tout"><pre>@@ -42,6 +42,7 @@ export function parse(input: string) {
-  const parts = input.split(',');
+  const parts = input.split(',').map((p) =&gt; p.trim());</pre></div></div>
  <div class="tool"><div class="th">${svg('terminal',13)}<span class="tname">Bash</span><span class="tsum">npm test &amp;&amp; git push</span></div></div>
  <div class="md-text"><p><strong>已修复 3 个失败的 job</strong>，全部测试通过并已推送：</p>
    <table><tr><th>job</th><th>原因</th><th>修复</th></tr>
    <tr><td>unit-tests</td><td>解析器未 trim 输入</td><td><code>parser.ts</code> 补 trim</td></tr>
    <tr><td>lint</td><td>未使用的 import</td><td>删除 import</td></tr>
    <tr><td>e2e</td><td>快照过期</td><td>更新快照</td></tr></table></div>
  <div class="res"><div class="rh">${svg('check',14)}<span class="big" style="color:var(--status-success)">成功</span>
    <span class="chip"><b>8</b> 轮</span><span class="chip"><b>1m20s</b></span><span class="chip"><b>$0.031</b></span>
    <span class="chip">in 12,480 · out 1,204</span></div>
    <div class="note">正文与上方的最终答复一致，已省略（不再重复显示同一段话）</div></div>
`;
const STREAM_ERR = `
  <div class="meta-line"><span>Claude Code 2.1.114</span><span class="dim">·</span><span>claude-sonnet-4-6</span></div>
  <div class="fold">${svg('chevron-right',12)} 思考</div>
  <div class="tool"><div class="th">${svg('terminal',13)}<span class="tname">Bash</span><span class="tsum">gh run list --limit 50</span></div></div>
  <div class="fold">${svg('chevron-right',12)} 诊断输出</div>
  <div class="res err"><div class="rh">${svg('warning',14)}<span class="big" style="color:var(--status-error)">失败</span>
    <span class="chip"><b>12</b> 轮</span><span class="chip"><b>3m02s</b></span><span class="chip"><b>$0.088</b></span>
    <span class="chip">stop_reason=tool_use</span></div>
    <div class="md-text" style="margin:9px 0 0"><p>超出最大轮次限制</p></div></div>
`;
const EMPTY_STREAM = `
  <div class="blank">
    <div class="ic">${svg('play',20)}</div>
    <h4>这个任务还没运行过</h4>
    <p>点「立即执行」跑一次，结果会显示在这里。之后每次运行也会自动出现，不需要手动打开历史。</p>
    <button class="btn primary tall">${svg('play',13)} 立即执行</button>
  </div>
`;

/* ============ 状态 ============ */
let activeTaskId = 't1', view = 'run', activeRunId = null, detail = null, useTimeline = true;
const byId = (id) => tasks.find((t) => t.id === id);
const runsOf = (t) => runsByTask[t.id] || [];

function renderList() {
  document.getElementById('taskRows').innerHTML = tasks.map((t) => `
    <div class="trow ${t.id === activeTaskId ? 'sel' : ''} ${t.enabled ? '' : 'off'}" tabindex="0" role="button" onclick="selectTask('${t.id}')">
      <span class="sd ${t.last === 'error' ? 'err' : t.enabled ? 'on' : 'off'}"></span>
      <span class="nm">${t.name}</span>
      <button class="toggle" title="${t.enabled ? '停用' : '启用'}" onclick="event.stopPropagation();toggleTask('${t.id}')">${svg('activity',12)}</button>
      <span class="meta">${t.schedule} · ${t.enabled ? (t.next || '—') : '已停用'}${t.last && t.last !== 'done' ? ' ' + pill(t.last) : ''}</span>
    </div>`).join('');
}

function renderDetail() {
  const t = byId(activeTaskId); const runs = runsOf(t);
  if (view === 'history') activeRunId = activeRunId ?? (runs[0]?.id ?? null);
  if (activeRunId && !runs.some((r) => r.id === activeRunId)) activeRunId = runs[0]?.id ?? null;
  if (!runs.length) activeRunId = null;

  document.getElementById('tbarDot').className = 'sd ' + (t.last === 'error' ? 'err' : t.enabled ? 'on' : 'off');
  document.getElementById('tbarName').textContent = detail ? detail.name : t.name;
  document.getElementById('runCount').textContent = String(t.runs);

  const sb = document.getElementById('sumbar');
  sb.classList.toggle('hidden', !!detail);
  sb.innerHTML = `<span class="chip">${svg('history',11)} ${t.schedule}</span>
    <span class="chip">${svg('clock',11)} ${t.enabled ? '下次 ' + (t.next || '—') : '已停用'}</span>
    ${t.last ? `<span class="chip">上次 ${STATUS[t.last].label} · ${t.lastAt}</span>` : '<span class="chip">还没跑过</span>'}
    ${t.cost ? `<span class="chip">均价 <b>$${t.cost}</b></span>` : ''}
    <span class="anno">摘要条 → chips</span>`;

  document.querySelectorAll('#viewSeg > button').forEach((b) => b.classList.toggle('on', b.dataset.view === view));
  document.getElementById('paneRun').classList.toggle('hidden', view !== 'run');
  document.getElementById('paneHistory').classList.toggle('hidden', view !== 'history');

  const paneRun = document.getElementById('paneRun');
  if (detail) paneRun.innerHTML = `<div class="stream">${detail.body}</div>`;
  else if (!runs.length) paneRun.innerHTML = EMPTY_STREAM;
  else {
    const r = runs.find((x) => x.id === activeRunId) || runs[0];
    const latest = r.id === runs[0].id;
    const bad = ['error','timeout'].includes(r.status);
    paneRun.innerHTML = `
      <div class="runhead">
        ${pill(r.status)}
        <span class="big">${r.when}</span>
        <span class="dim small">${r.trigger}</span>
        <div class="mets">${r.meta.split(' · ').map((m) => `<span class="chip">${m}</span>`).join('')}</div>
        ${latest ? '' : '<span class="link" onclick="backToLatest()">回到最新</span>'}
      </div>
      <div class="stream">${bad ? STREAM_ERR : STREAM_OK}</div>`;
  }

  const body = document.getElementById('histBody');
  if (!runs.length) {
    body.innerHTML = `<div class="blank" style="min-height:240px"><div class="ic">${svg('history',20)}</div>
      <h4>还没有运行记录</h4><p>任务跑过之后，每次运行的完整流水都会留在这里。</p></div>`;
  } else if (useTimeline) {
    body.innerHTML = `<div class="tl">${runs.map((r) => {
      const bad = ['error','timeout'].includes(r.status);
      return `<div class="tlrow ${r.id === activeRunId ? 'sel' : ''}" tabindex="0" role="button" onclick="openRun('${r.id}')">
        <span class="node ${r.status === 'done' ? 'ok' : bad ? 'bad' : ''}"></span>
        <span class="when">${r.when}</span>
        ${pill(r.status)}
        <span class="tg">${r.trigger}</span>
        <span class="ms">${r.ms}</span>
        <span class="mt">${r.meta}</span>
        ${svg('chevron-right',12)}
      </div>`; }).join('')}</div>`;
  } else {
    body.innerHTML = runs.map((r) => `<div class="tlrow" style="padding-left:18px" onclick="openRun('${r.id}')">
      <span class="when">${r.when}</span>${pill(r.status)}<span class="tg">${r.trigger}</span>
      <span class="ms">${r.ms}</span><span class="mt">${r.meta}</span>${svg('chevron-right',12)}</div>`).join('');
  }
}

function selectTask(id) { activeTaskId = id; activeRunId = null; detail = null; view = 'run'; render(); }
function toggleTask(id) { const t = byId(id); t.enabled = !t.enabled; render(); }
function openRun(id) { activeRunId = id; view = 'run'; render(); }
function backToLatest() { activeRunId = runsOf(byId(activeTaskId))[0]?.id ?? null; render(); }
document.querySelectorAll('#viewSeg > button').forEach((b) => b.addEventListener('click', () => { view = b.dataset.view; detail = null; render(); }));

document.getElementById('moreBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  const host = e.currentTarget;
  const m = document.createElement('div');
  m.className = 'menu';
  m.innerHTML = `<button onclick="closeMenu();openForm('edit')">${svg('pencil',13)} 编辑任务</button>
    <button onclick="closeMenu();openForm('create')">${svg('copy',13)} 复制为新任务</button>
    <div class="sep"></div>
    <button class="danger" onclick="closeMenu();note('删除前会二次确认','确认文案需写明「会同时删除该任务的运行历史」，并先取消在跑的 run。')">${svg('trash',13)} 删除任务</button>`;
  host.parentElement.appendChild(m);
  const r = host.getBoundingClientRect(), pr = host.parentElement.getBoundingClientRect();
  m.style.top = (r.bottom - pr.top + 4) + 'px'; m.style.right = '10px';
  setTimeout(() => document.addEventListener('click', closeMenu, { once:true }), 0);
});
function closeMenu() { document.querySelectorAll('.menu').forEach((n) => n.remove()); }
function note(title, body) {
  detail = { name: '（草图占位）', body: `<div class="blank"><div class="ic">${svg('warning',20)}</div><h4>${title}</h4><p>${body}</p></div>` };
  render();
}

/* ============ 模板 ============ */
const ALL_DAYS = [1,2,3,4,5,6,7];
const BUILTIN = [
  { id:'ci',    icon:'activity',     name:'CI 失败巡检', blurb:'查最近的 CI 失败并修复',  sched:{kind:'daily',h:9,m:0,days:ALL_DAYS},            prompt:'检查 D:\\work\\myapp 最近的 CI 失败，定位原因并修复，完成后提交并推送。' },
  { id:'sum',   icon:'file-text',    name:'变更摘要',    blurb:'汇总今天的提交与 PR',     sched:{kind:'daily',h:18,m:0,days:ALL_DAYS},           prompt:'汇总 D:\\work\\myapp 今天的提交与 PR，按模块分组写一份简报。' },
  { id:'sec',   icon:'shield-alert', name:'依赖审计',    blurb:'扫依赖漏洞并给修复建议',   sched:{kind:'daily',h:9,m:0,days:[1]},                 prompt:'审计 D:\\work\\myapp 的依赖漏洞，列出可升级项与风险等级。' },
  { id:'clean', icon:'trash',        name:'清理产物',    blurb:'清掉过期的构建产物',       sched:{kind:'daily',h:18,m:0,days:[5]},                prompt:'清理 D:\\work\\myapp 下超过 7 天的构建产物与缓存，报告释放的空间。' },
  { id:'up',    icon:'arrow-up',     name:'依赖升级',    blurb:'每月 1 日升级依赖并跑测试', sched:{kind:'cron',cron:'0 10 1 * *'},                 prompt:'把 D:\\work\\myapp 的依赖升级到最新兼容版本，跑通测试后提交。' },
  { id:'log',   icon:'terminal',     name:'日志巡检',    blurb:'扫异常日志并归类',         sched:{kind:'interval',n:6,unit:'小时',days:ALL_DAYS}, prompt:'扫描 D:\\work\\myapp\\logs 最近的异常日志，按类型归类并标出新增的异常。' },
  { id:'dep',   icon:'rocket',       name:'发布自检',    blurb:'发版前跑一遍检查清单',      sched:{kind:'daily',h:9,m:0,days:[3]},                 prompt:'对 D:\\work\\myapp 执行发布前自检：构建、测试、变更日志、版本号一致性。' },
  { id:'doc',   icon:'file-text',    name:'文档同步',    blurb:'改了接口就更新文档',       sched:{kind:'daily',h:11,m:0,days:[5]},                prompt:'检查 D:\\work\\myapp 本周改动的公开接口，同步更新 docs/ 下的文档。' },
  { id:'todo',  icon:'layers',       name:'TODO 归集',   blurb:'把散落的 TODO 收成清单',   sched:{kind:'daily',h:10,m:0,days:[1]},                prompt:'收集 D:\\work\\myapp 里新出现的 TODO/FIXME，按模块汇总成一份清单。' },
  { id:'blank', icon:'plus',         name:'空白任务',    blurb:'从零开始写 prompt',        sched:{kind:'daily',h:9,m:0,days:ALL_DAYS},            prompt:'' },
];
let MY = [
  { id:'m1', icon:'bookmark', name:'部署前检查', blurb:'我保存的模板', sched:{kind:'daily',h:9,m:0,days:[4]}, prompt:'对 D:\\work\\myapp 执行部署前检查：迁移脚本、配置项、回滚方案。', mine:true },
  { id:'m2', icon:'bookmark', name:'周会材料',   blurb:'我保存的模板', sched:{kind:'daily',h:9,m:0,days:[1]}, prompt:'根据 D:\\work\\myapp 上周的提交与 issue，整理周会材料。', mine:true },
];
let RECENT = ['ci', 'sec', 'clean'];

/* 模板分组（左栏渲染用） */
function groups(filter) {
  const kw = (filter || '').trim().toLowerCase();
  const hit = (t) => !kw || t.name.toLowerCase().includes(kw) || t.blurb.toLowerCase().includes(kw);
  const recent = RECENT.map((id) => [...BUILTIN, ...MY].find((t) => t.id === id)).filter(Boolean).filter(hit);
  return [
    { label:'最近使用', items: recent },
    { label:'我的模板', items: MY.filter(hit) },
    { label:'内置',     items: BUILTIN.filter(hit) },
  ].filter((g) => g.items.length);
}

/* 执行频率：3 种模式 + 自定义 crontab */
const KINDS = [['daily','每天'],['interval','按间隔'],['once','单次执行'],['cron','自定义 crontab']];
const DAYS = ['一','二','三','四','五','六','日'];
const HOURS = Array.from({length:24},(_,i)=>String(i).padStart(2,'0'));
const MINS = Array.from({length:12},(_,i)=>String(i*5).padStart(2,'0'));
const opts = (a, cur) => a.map((o) => `<option ${o===cur?'selected':''}>${o}</option>`).join('');

const form = {
  tmpl:'ci', name:'', prompt:'', adv:false, filter:'',
  kind:'daily',
  h:'09', m:'00',
  days:[1,2,3,4,5,6,7],           // 生效的天（周一~周日）
  intervalN:'3', intervalUnit:'小时',
  bounded:false, fromDate:'2026-09-21', toDate:'2026-12-31',  // 生效区间（可选）
  onceDate:'2026-09-22',
  cron:'0 9 * * 1-5',
};

function daysText() {
  if (form.days.length === 7) return '每天';
  if (form.days.length === 0) return '未选择';
  const s = [...form.days].sort((a,b)=>a-b);
  if (s.length === 5 && s.join() === '1,2,3,4,5') return '工作日';
  if (s.length === 2 && s.join() === '6,7') return '周末';
  return '周' + s.map((d)=>DAYS[d-1]).join('、');
}
/** 模板自带调度的可读摘要（左栏与选中卡片上展示） */
function tplSched(t) {
  const s = t.sched;
  if (s.kind === 'cron') return s.cron;
  if (s.kind === 'interval') return `每 ${s.n} ${s.unit}`;
  const d = s.days.length === 7 ? '每天' : '周' + [...s.days].sort((a,b)=>a-b).map((x)=>DAYS[x-1]).join('、');
  return `${d} ${String(s.h).padStart(2,'0')}:${String(s.m).padStart(2,'0')}`;
}
/** 由当前选择推导出的 cron 表达式（生效区间不在 cron 里表达，见下方注释） */
function exprOf() {
  const t = `${+form.m} ${+form.h}`;
  const dow = form.days.length === 7 ? '*' : [...form.days].sort((a,b)=>a-b).map((d)=>d%7).join(',');
  if (form.kind === 'daily') return `${t} * * ${dow}`;
  if (form.kind === 'interval') {
    return form.intervalUnit === '小时'
      ? `0 */${+form.intervalN} * * ${dow}`
      : `${+form.m} ${+form.h} */${+form.intervalN} * *`;
  }
  if (form.kind === 'once') return '（单次不走 cron，用 --run-at 一次性触发）';
  return form.cron || '';
}

function openForm(mode) {
  form.mode = mode;
  const host = document.createElement('div');
  host.className = 'overlay';
  host.innerHTML = `<div class="dlg ${mode === 'create' ? 'wide' : 'narrow'}">
    <div class="dlg-hd">${mode === 'create' ? '新建任务' : '编辑任务'}<span class="sub">${mode === 'create' ? '选一个模板 → 确认时间 → 需要的话改改内容' : '修改这个任务的调度或内容'}</span><span class="x" onclick="closeForm()">${svg('close',16)}</span></div>
    <div class="dlg-cols">
      ${mode === 'create' ? '<div class="rail" id="rail"></div>' : ''}
      <div class="form"><div class="form-bd" id="formBody"></div></div>
    </div>
    <div class="dlg-ft">
      ${mode === 'create' ? `<button class="btn" onclick="saveAsTemplate()">${svg('bookmark',13)} 保存为模板</button>` : ''}
      <span class="sp"></span>
      <button class="btn" onclick="closeForm()">取消</button>
      <button class="btn primary tall" onclick="closeForm()">${mode === 'create' ? '创建任务' : '保存'}</button>
    </div>
  </div>`;
  host.addEventListener('click', (e) => { if (e.target === host) closeForm(); });
  document.body.appendChild(host);
  renderForm();
}
function closeForm() { document.querySelectorAll('.overlay').forEach((n) => n.remove()); }

function renderRail() {
  const el = document.getElementById('rail');
  if (!el) return;
  const gs = groups(form.filter);
  el.innerHTML = `
    <div class="rail-hd"><div class="search">${svg('search',12)}
      <input placeholder="搜索模板…" value="${form.filter}"
             oninput="form.filter=this.value;renderRail()" /></div></div>
    <div class="rail-list">
      ${gs.length ? gs.map((g) => `<div class="group-label">${g.label}</div>${g.items.map((t) => `
        <button class="rail-item ${t.id === form.tmpl ? 'on' : ''}" onclick="applyTemplate('${t.id}')">
          ${svg(t.icon,14)}<span class="rn">${t.name}</span>${t.mine ? '<span class="rmark">我的</span>' : ''}
        </button>`).join('')}`).join('')
      : `<div class="rail-empty">没有匹配的模板</div>`}
    </div>
    <div class="rail-ft">
      <button class="btn" onclick="saveAsTemplate()">${svg('plus',13)} 从当前内容新建模板</button>
    </div>`;
}

function currentTemplate() { return [...MY, ...BUILTIN].find((t) => t.id === form.tmpl) || BUILTIN[0]; }

function applyTemplate(id) {
  const t = [...MY, ...BUILTIN].find((x) => x.id === id);
  if (!t) return;
  const s = t.sched;
  form.tmpl = id; form.kind = s.kind;
  if (s.h != null) form.h = String(s.h).padStart(2,'0');
  if (s.m != null) form.m = String(s.m).padStart(2,'0');
  form.days = s.days ? [...s.days] : [...ALL_DAYS];
  if (s.cron) form.cron = s.cron;
  if (s.n) form.intervalN = String(s.n);
  if (s.unit) form.intervalUnit = s.unit;
  form.prompt = t.prompt; form.name = '';
  renderForm();
}

function saveAsTemplate() {
  if (!form.prompt.trim()) { alert('先写点内容再保存为模板'); return; }
  const name = (prompt('模板名称', currentTemplate().name) || '').trim();
  if (!name) return;
  MY.unshift({ id: 'm' + Date.now(), icon: 'bookmark', name, blurb: '我保存的模板', mine: true,
               sched: { kind: form.kind, h: +form.h, m: +form.m, days: [...form.days],
                        n: +form.intervalN, unit: form.intervalUnit, cron: form.cron },
               prompt: form.prompt });
  renderRail(); renderForm();
}

/* 生效的天：7 个圆角方片（周一~周日）+ 工作日/周末/全选 快捷 */
function dayChips() {
  return `<div class="row">
    <div class="week">${DAYS.map((d,i)=>`<button class="wd ${form.days.includes(i+1)?'on':''}" onclick="toggleDay(${i+1})" title="周${d}">${d}</button>`).join('')}</div>
    <div class="presets">
      <button class="preset" onclick="setDays([1,2,3,4,5])">工作日</button>
      <button class="preset" onclick="setDays([6,7])">周末</button>
      <button class="preset" onclick="setDays([1,2,3,4,5,6,7])">全选</button>
    </div>
    <span class="chip" style="margin-left:auto">${daysText()}</span>
  </div>`;
}
function setDays(a) { form.days = [...a]; renderForm(); }
/* 生效区间（可选）：不限 / 指定起止日期 */
function rangeFields() {
  return `<div class="radios">
      <button class="radio ${!form.bounded?'on':''}" onclick="form.bounded=false;renderForm()">不限</button>
      <button class="radio ${form.bounded?'on':''}" onclick="form.bounded=true;renderForm()">指定区间</button>
    </div>
    ${form.bounded ? `<div class="row" style="margin-top:8px">
      <input class="inp mono" type="date" value="${form.fromDate}" onchange="form.fromDate=this.value;renderForm()" />
      <span class="dim small">到</span>
      <input class="inp mono" type="date" value="${form.toDate}" onchange="form.toDate=this.value;renderForm()" />
    </div>` : `<div class="dim small" style="margin-top:7px">长期有效</div>`}`;
}
function previewItems() {
  if (form.kind === 'cron') return `<span class="pl">按表达式计算</span>`;
  if (form.kind === 'once') return `<span class="pl">${form.onceDate} ${form.h}:${form.m}</span><span class="dim">只跑一次</span>`;
  if (form.days.length === 0) return `<span class="dim">请至少选一天</span>`;
  const base = form.kind === 'interval' && form.intervalUnit === '小时'
    ? ['今天 12:00', '今天 15:00', '今天 18:00']
    : ['明天 09:00', '后天 09:00', '周四 09:00'];
  return base.map((n) => `<span class="pl">${n}</span>`).join('');
}

function renderForm() {
  const t = currentTemplate();
  document.getElementById('formBody').innerHTML = `
    <div class="sec">
      <div class="tmpl-card">
        <span class="ti">${svg(t.icon,17)}</span>
        <div style="flex:1;min-width:0">
          <div class="tt" style="display:flex;align-items:center;gap:8px">${t.name}
            <span class="chip mono" style="font-size:10px">${tplSched(t)}</span></div>
          <div class="td">${t.blurb}${form.mode === 'create' ? ' · 左侧可换模板' : ''}</div>
        </div>
      </div>
      <div class="field"><label>名称</label><div class="ctl">
        <input class="inp" style="width:100%" placeholder="${t.name}" value="${form.name}" oninput="form.name=this.value" />
      </div></div>
    </div>

    <div class="sec">
      <div class="sec-hd"><span class="t">执行频率</span><span class="d">选模式 → 用鼠标挑时间和生效范围</span>
        <span class="anno">3 种模式 + crontab</span></div>
      <div class="radios">${KINDS.map(([k,l]) => `<button class="radio ${form.kind===k?'on':''}" onclick="setKind('${k}')">${l}</button>`).join('')}</div>

      ${form.kind==='daily' ? `
        <div class="field"><label>执行时间</label><div class="ctl"><div class="row">
          <select class="inp mono" onchange="form.h=this.value;renderForm()">${opts(HOURS, form.h)}</select>
          <span class="dim">:</span>
          <select class="inp mono" onchange="form.m=this.value;renderForm()">${opts(MINS, form.m)}</select>
        </div></div></div>` : ''}

      ${form.kind==='interval' ? `
        <div class="field"><label>间隔</label><div class="ctl"><div class="row">
          <span class="dim small">每</span>
          <select class="inp mono" onchange="form.intervalN=this.value;renderForm()">${opts(['1','2','3','4','6','8','12','24'], form.intervalN)}</select>
          <select class="inp mono" onchange="form.intervalUnit=this.value;renderForm()">${opts(['小时','天'], form.intervalUnit)}</select>
        </div></div></div>` : ''}

      ${form.kind==='once' ? `
        <div class="field"><label>执行日期</label><div class="ctl">
          <input class="inp mono" type="date" value="${form.onceDate}" onchange="form.onceDate=this.value;renderForm()" /></div></div>
        <div class="field"><label>执行时间</label><div class="ctl"><div class="row">
          <select class="inp mono" onchange="form.h=this.value;renderForm()">${opts(HOURS, form.h)}</select>
          <span class="dim">:</span>
          <select class="inp mono" onchange="form.m=this.value;renderForm()">${opts(MINS, form.m)}</select>
        </div></div></div>` : ''}

      ${form.kind==='cron' ? `
        <div class="field"><label>表达式</label><div class="ctl">
          <input class="inp mono" style="width:100%" value="${form.cron}" oninput="form.cron=this.value" />
          <div class="dim small" style="margin-top:7px">分 时 日 月 星期 —— 例 <span class="mono">0 9 * * 1-5</span> 表示工作日 09:00</div>
        </div></div>` : ''}

      ${form.kind==='once' || form.kind==='cron' ? '' : `
        <div class="field"><label>生效的天</label><div class="ctl">${dayChips()}</div></div>
        <div class="field"><label>生效区间</label><div class="ctl">${rangeFields()}</div></div>`}

      <div class="preview">
        <span class="lb">接下来 3 次</span>
        ${previewItems()}
        <span class="sp"></span>
        <span class="mono dim" style="font-size:11px">${exprOf()}</span>
      </div>
    </div>

    <div class="sec">
      <div class="sec-hd"><span class="t">任务内容</span><span class="d">已按模板填好，可改</span></div>
      <textarea class="inp" id="promptBox" oninput="form.prompt=this.value" placeholder="写下这个任务要做什么…">${form.prompt}</textarea>
    </div>

    <div class="adv">
      <div class="fold" onclick="form.adv=!form.adv;renderForm()">${svg(form.adv?'chevron-down':'chevron-right',12)} 高级（运行 Agent）</div>
      ${form.adv ? `<div class="sec" style="margin-top:12px">
        <div class="field"><label>Agent</label><div class="ctl"><select class="inp">${opts(['claude（默认）','codex','opencode','omp'],'claude（默认）')}</select></div></div>
      </div>` : ''}
    </div>

    <div class="warn">${svg('warning',14)}<span>定时任务无人值守运行，将以完全权限执行（<span class="mono">bypassPermissions</span>），请确认任务内容可信。</span></div>`;
  renderRail();
}
function exprOf() {
  const p = form;
  const time = `${+p.m} ${+p.h}`;
  if (p.kind==='daily') return `${time} * * *`;
  if (p.kind==='weekly') return `${time} * * ${[...p.days].sort((a,b)=>a-b).join(',')}`;
  if (p.kind==='monthly') return `${time} ${+p.dom} * *`;
  if (p.kind==='hourly') return `${+p.m} * * * *`;
  if (p.kind==='everyN') return `*/${+p.every} * * * *`;
  return p.custom || '';
}
function setKind(k) { form.kind = k; renderForm(); }
function toggleDay(d) { form.days = form.days.includes(d) ? form.days.filter((x)=>x!==d) : [...form.days, d]; renderForm(); }

/* ============ 主题 / 标注 ============ */
document.getElementById('themeBtn').addEventListener('click', (e) => {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
  e.currentTarget.textContent = dark ? '切换深色' : '切换浅色';
});
document.getElementById('annoToggle').addEventListener('change', (e) => document.body.classList.toggle('annotate', e.target.checked));
document.getElementById('tlToggle').addEventListener('change', (e) => { useTimeline = e.target.checked; render(); });

function render() { renderList(); renderDetail(); }
/* 初始：把第一个模板的内容填进表单 */
form.prompt = BUILTIN[0].prompt;
render();
</script>
</body>
</html>
