name: Build VS Code Extension
on:
  push:
    paths:
      - 'vscode-extension/**'
    branches:
      - vscode-terminal
  pull_request:
    paths:
      - 'vscode-extension/**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd vscode-extension && npm ci && npm run compile
      - run: cd vscode-extension && npm test || true
