# dsh-lynel-plugin bundle patch: activates the plugin in a DSH profile.
#
# When installed via `dsh plugin --profile <name> add dsh-lynel-plugin` (or pnpm
# add into the profile), the `dsh.bundle.patch` manifest field makes the
# loader append this package to `dsh.profile.bundles`, and this patch inserts
# the host row below. The browser half is discovered automatically by the
# client-modules scan of every loaded entry (see `dsh.client` in package.json).
#
# The row needs no config: all knobs live in the plugin code defaults
# (bot.json path, ask/envelope endpoints) and can be overridden here, e.g.
#   config:
#     botFile: '!!js join(homedir(), ".lynel-desktop", "bot.json")'
#     envelopeEndpoint: 'http://localhost:17527/deepseek-harness/envelope'
#     askEndpoint: 'http://localhost:17527/deepseek-harness/ask'
- insert:
    - id: dsh-lynel-plugin
      name: 'dsh-lynel-plugin'
