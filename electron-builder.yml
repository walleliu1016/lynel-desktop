appId: com.akke.lynel-desktop
productName: Lynel Desktop
copyright: Copyright © 2026
directories:
  output: dist
  buildResources: build
files:
  - dist-electron/**/*
  - src/renderer/dist/**/*
  - build/windows/trayicon.ico
  - build/darwin/trayicon.png
  - build/linux/trayicon.png
# DeepSeek Harness 由 Electron 主进程以 ELECTRON_RUN_AS_NODE 子进程启动，
# 子进程无法可靠读取 asar 内模块，需将 node_modules 整体 unpack 到
# app.asar.unpacked 供其以真实文件解析依赖。
asarUnpack:
  - "node_modules/**/*"
extraMetadata:
  main: dist-electron/src/main/index.js
icon: build/appicon.png
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
win:
  target:
    - target: nsis
      arch: x64
  icon: build/windows/icon.ico
mac:
  target:
    - target: dmg
      arch: x64
  category: public.app-category.developer-tools
linux:
  target:
    - target: AppImage
      arch: x64
  category: Development
  icon: build/linux/icon.png
artifactName: lynel-desktop-${version}-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

publish:
  - provider: github
    owner: walleliu1016
    repo: lynel-desktop
    releaseType: release
