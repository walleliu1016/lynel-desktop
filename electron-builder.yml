appId: com.akke.lynel-desktop
productName: Lynel Desktop
copyright: Copyright © 2026
directories:
  output: dist
  buildResources: build
files:
  - dist-electron/**/*
  - src/renderer/dist/**/*
  - build/windows/trayicon.ico
  - build/darwin/trayicon.png
  - build/linux/trayicon.png
extraMetadata:
  main: dist-electron/src/main/index.js
icon: build/appicon.png
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
win:
  target:
    - target: nsis
      arch: x64
  icon: build/windows/icon.ico
mac:
  target:
    - target: dmg
      arch: x64
  category: public.app-category.developer-tools
  # hardened runtime + entitlements：Apple 公证（notarization）的前提
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # 检测到 APPLE_API_KEY / APPLE_ID 凭据环境变量时自动 notarize + staple
  notarize: true
linux:
  target:
    - target: AppImage
      arch: x64
  category: Development
  icon: build/linux/icon.png
artifactName: lynel-desktop-${version}-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

publish:
  - provider: github
    owner: walleliu1016
    repo: lynel-desktop
    releaseType: release
